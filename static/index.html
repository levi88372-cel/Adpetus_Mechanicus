<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu Principal · Inventário</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header class="barra-topo">
    <h1>Menu Principal</h1>
  </header>

  <main class="container">

    <div class="painel">
      <form id="form-produto" class="conteudo">
        <h2 id="titulo-form">Novo registro</h2>

        <label class="item">
          <span class="rotulo">Designação</span>
          <input type="text" name="nome" placeholder="Ex: HAMMERBURST Mk-II" required>
        </label>

        <label class="item">
          <span class="rotulo">Valor (R$)</span>
          <input type="number" name="preco" step="0.01" min="0.01" placeholder="0,00" required>
        </label>

        <label class="item">
          <span class="rotulo">Fabricante</span>
          <input type="text" name="fabricante" placeholder="Ex: SERADYNE ARMORY" required>
        </label>

        <div class="botoes">
          <button type="submit" id="btn-salvar" class="destaque">Registrar</button>
          <button type="button" id="btn-cancelar" class="secundario" hidden>Abortar</button>
        </div>

        <p id="mensagem" role="alert"></p>
      </form>
    </div>

    <div class="painel">
      <section class="conteudo">
        <h2>Inventário</h2>
        <div class="tabela-wrapper">
          <table>
            <thead>
              <tr>
                <th>Cód.</th>
                <th>Designação</th>
                <th>Valor</th>
                <th>Fabricante</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="lista"></tbody>
          </table>
        </div>
      </section>
    </div>

    <p class="descricao">
      Registre, edite ou remova mercadorias do inventário oficial.
    </p>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
